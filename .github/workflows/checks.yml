# Проверки на каждую ветку и каждый PR.
#
# Повод: у сборки не было ни одной машинной проверки, всё держалось на памяти
# того, кто правит. За двое суток так утекли четыре дефекта, в том числе
# обращение к несуществующему атрибуту, которое всплыло только на проде.
name: checks

on:
  push:
    branches-ignore: [dev]
  pull_request:
    branches: [dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить ruff
        run: pip install --quiet ruff

      # Набор узкий намеренно: синтаксис, неопределённые имена, ошибки в
      # f-строках и сравнениях. Полный набор ruff даёт на этой кодовой базе
      # 2815 замечаний — ворота из них не сделать, а эти четыре правила
      # ловят то, что падает в работе. --isolated, потому что конфига ruff в
      # репозитории нет: pyproject.toml, на который ссылается pre-commit
      # проекта, отсутствует, и тот вызов всегда падал незамеченным.
      #
      # handlers/utils.py:F821 — ложное: имя стоит в строковой аннотации, а
      # импортируется внутри функции.
      - name: Разбор ruff
        run: >
          ruff check . --isolated
          --select E9,F63,F7,F82
          --exclude main.py,handlers/payments
          --extend-per-file-ignores "handlers/utils.py:F821"

      - name: Тесты без установленного бота
        # Часть набора требует aiogram и падает на импорте — так же и на dev.
        # Поэтому гоняем файлы, которые работают без бота, и требуем от них
        # зелёного. Набор с другой ошибкой роняет проверку.
        run: |
          set -u
          ok=0
          for f in tests/test_*.py; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .py)
            if python3 -I -m unittest discover -s tests -p "$name.py" >/tmp/out 2>&1; then
              echo "ok   $name"
              ok=$((ok+1))
            elif grep -qE "ModuleNotFoundError: No module named '(aiogram|aiohttp|loguru|sqlalchemy|telegram)'" /tmp/out; then
              echo "skip $name (нужен установленный бот)"
            else
              echo "FAIL $name"
              cat /tmp/out
              exit 1
            fi
          done
          echo "зелёных наборов: $ok"
          test "$ok" -gt 0
